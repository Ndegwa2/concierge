name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Ratcheting gate: fails only when the pre-existing `tsc --strict`
      # backlog grows. See scripts/typecheck-baseline.mjs.
      - name: Type check (no new errors)
        run: npm run typecheck:baseline

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  backend:
    name: Backend (compile + lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoconcierge
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: autoconcierge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-secret-key-not-a-real-secret
      JWT_SECRET_KEY: ci-jwt-secret-not-a-real-secret
      # Deterministic Fernet key for CI only.
      ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzLWxvbmc=
      DATABASE_URL: postgresql://autoconcierge:ci-password@localhost:5432/autoconcierge_test
      REDIS_URL: redis://localhost:6379/0
      RATELIMIT_STORAGE_URI: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q app

      - name: Lint
        run: ruff check app
        continue-on-error: true

      - name: Run migrations
        run: flask db upgrade
        env:
          FLASK_APP: run.py

      - name: Tests
        run: pytest -q

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt
        continue-on-error: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure no env files are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo "::error::A .env file is tracked in git. Remove it and rotate the secrets."
            exit 1
          fi
          echo "No tracked .env files."

      - name: Ensure node_modules / venv are not tracked
        run: |
          if git ls-files | grep -qE '^(node_modules|venv|backend/venv)/'; then
            echo "::error::Vendor directories are tracked in git. Run: git rm -r --cached node_modules venv"
            exit 1
          fi
          echo "No tracked vendor directories."

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
