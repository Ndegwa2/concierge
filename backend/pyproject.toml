[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:flask_limiter.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["migrations", "venv", ".venv", "__pycache__"]

[tool.ruff.lint]
# Deliberately narrow to start: correctness and security rules only, so the
# gate is meaningful instead of drowning in style noise on a legacy codebase.
select = ["E9", "F63", "F7", "F82", "F401", "B"]
ignore = [
    "B008",  # function call in default arg - common in Flask/SQLAlchemy
    "B904",  # raise ... from err - worth doing, too noisy to gate on today
]

[tool.ruff.lint.per-file-ignores]
"app/models.py" = ["F401"]          # intentional re-export barrel
"app/services/*/__init__.py" = ["F401"]
"tests/*" = ["F401"]
