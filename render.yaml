# Render Blueprint Configuration
# This file defines the services for automated deployment to Render
# Learn more: https://render.com/docs/blueprint-spec
#
# SECURITY:
#   The envVars below with hardcoded 'value:' entries are committed to git.
#   For production, after the initial Blueprint deploy, move ALL secrets to
#   Render's Secret Manager (or render.com dashboard > Environment > Secrets)
#   and remove them from this file. See: https://render.com/docs/secret-manager
#   Required secrets to add via dashboard (not in render.yaml):
#     - COHERE_API_KEY  (used by /api/ai-chat/health and AI embeddings)
#     - MAIL_USERNAME   (SMTP auth — your Gmail address)
#     - MAIL_PASSWORD   (Gmail App Password, NOT your account password)
#     - MPESA_CONSUMER_KEY, MPESA_CONSUMER_SECRET, MPESA_PASSKEY (payments)
#     - MPESA_SHORTCODE, MPESA_CALLBACK_URL, MPESA_ENVIRONMENT
#   Rotate these periodically: python -c "import secrets; [print(f'{k}: {secrets.token_hex(32)}') for k in ['JWT_SECRET_KEY','SECRET_KEY','PHONE_TOKEN_PEPPER']]"


services:
  # Backend API Service (Flask + PostgreSQL)
  - type: web
    name: auto-concierge-backend
    env: python
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt && flask db upgrade
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --max-requests 1000 --max-requests-jitter 50 "run:app"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON_PATH
        value: /opt/render/project/backend
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: autoconcierge-postgres
          property: connectionString
      - key: DATABASE_READ_URL
        fromDatabase:
          name: autoconcierge-postgres-read
          property: connectionString
      - key: REDIS_URL
        fromAddOn:
          name: autoconcierge-redis
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromAddOn:
          name: autoconcierge-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        value: "bnszJ3TOQ3kqLbAKmBROxBOrgWCAhjhTkPe-BV1ILqI="
      - key: JWT_SECRET_KEY
        value: "7e347dc1c457dabf13165d72e1a82d75d55796e9ba17a7c6442ecc47db7c836f"
      - key: SECRET_KEY
        value: "c80834cbb348257b0a57d1c3c990f7d07564facda6b90079248018967ccf4217"
      # Pepper for HMAC-SHA256 phone search tokens (separate from SECRET_KEY).
      # Without this in production, phone searches silently fall back to SECRET_KEY.
      # Rotate this value with: python -c "import secrets; print(secrets.token_hex(32))"
      # and re-run: flask backfill-phone-tokens
      - key: PHONE_TOKEN_PEPPER
        value: "c33a3a1e4ee02fa931f0e2e3e1f5e52bcb34b5399d6cb69a78c3eacd87bb7bdc"
      - key: CORS_ORIGIN
        value: https://auto-concierge-frontend.onrender.com
      # --- Secrets that MUST be set via Render dashboard after deploy ---
      # (Kept out of render.yaml to avoid exposing credentials in git)
      # Set each of these in: render.com dashboard > auto-concierge-backend > Environment > Secrets
      # - COHERE_API_KEY
      # - MAIL_USERNAME
      # - MAIL_PASSWORD   (Gmail App Password, not account password)
      # - MPESA_CONSUMER_KEY
      # - MPESA_CONSUMER_SECRET
      # - MPESA_PASSKEY
      # - MPESA_SHORTCODE
      # - MPESA_CALLBACK_URL
      # - MPESA_ENVIRONMENT  (set to 'production'

  # Frontend Static Site
  - type: web
    name: auto-concierge-frontend
    env: static
    region: oregon
    buildCommand: npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://auto-concierge-backend.onrender.com/api
      - key: VITE_APP_ENV
        value: production

# PostgreSQL databases (managed by Render)
databases:
  - name: autoconcierge-postgres
    region: oregon
    plan: standard-0  # Hobby tier: shared RAM, 0.5 GB
    # Upgrade to standard-1 (Dedicated RAM, 1 GB) for production workloads

  - name: autoconcierge-postgres-read
    region: oregon
    plan: standard-0
    readReplica: true
    # This is a read-only replica of autoconcierge-postgres

# Redis (managed cache)
# Used for session storage, rate limiting, and query caching
# https://render.com/docs/redis
addOns:
  - name: autoconcierge-redis
    plan: free

# Notes:
# 1. PostgreSQL is provisioned automatically via the databases section above.
#    No persistent disk needed — data is managed by Render's PostgreSQL service.
#
# 2. Before first deploy, run the PostgreSQL setup script manually:
#    psql $DATABASE_URL -f backend/postgresql_setup.sql
#    Then: flask db upgrade
#
# 3. After deploying backend:
#    - Copy the backend URL (e.g., https://auto-concierge-backend.onrender.com)
#    - Update CORS_ORIGIN in backend env vars if different
#    - Update VITE_API_URL in frontend env vars
#    - Redeploy frontend
#
# 4. Connection pooling: Render's PostgreSQL handles PgBouncer on the
#    database side. The Flask app uses pool_size=20 with max_overflow=0
#    (configured in __init__.py and .env.production).
#    Monitor connections: SELECT count(*) FROM pg_stat_activity;
#
# 5. For production traffic, upgrade the database plan to at least
#    standard-2 (2 GB RAM, 1 dedicated CPU) to handle connection pooling
#    and query load adequately.
